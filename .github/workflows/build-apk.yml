name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # Cần để tạo GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần full history để đếm commit count cho version

      - name: Compute version (commit-count + short-sha)
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short=7 HEAD)
          MSG=$(git log -1 --pretty=%s | head -c 100)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="b${COUNT}.${SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "msg=$MSG" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION ($MSG)"

      - name: Inject build version into app
        run: |
          cat > www/js/app-version.js <<EOF
          // AUTO-GENERATED bởi GitHub Actions — KHÔNG sửa thủ công
          window.QLT_BUILD = {
            version: "${{ steps.ver.outputs.version }}",
            tag: "${{ steps.ver.outputs.tag }}",
            commitCount: ${{ steps.ver.outputs.commit_count }},
            sha: "$(git rev-parse --short=7 HEAD)",
            buildDate: "${{ steps.ver.outputs.date }}",
            commitMsg: "${{ steps.ver.outputs.msg }}"
          };
          EOF
          echo "--- app-version.js content:"
          cat www/js/app-version.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Override launcher icons (cọc tiền xanh thay vì icon mặc định Capacitor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          SRC=www/icons/icon-512.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${entry%%:*}
            size=${entry##*:}
            DIR=android/app/src/main/res/mipmap-$density
            mkdir -p "$DIR"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_round.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_foreground.png"
          done

      - name: Inject AI Chat widget + Quick Settings tile vào Android project
        run: |
          set -e
          # Copy widget + tile assets vào đúng vị trí trong Android project
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/java/com/thanh/quanlytien

          # Home screen widget
          cp android-widget/res/xml/ai_chat_widget_info.xml android/app/src/main/res/xml/
          cp android-widget/res/layout/ai_chat_widget.xml android/app/src/main/res/layout/
          cp android-widget/res/drawable/ai_widget_bg.xml android/app/src/main/res/drawable/
          cp android-widget/res/values/strings_widget.xml android/app/src/main/res/values/
          cp android-widget/java/AiChatWidgetProvider.java android/app/src/main/java/com/thanh/quanlytien/

          # Quick Settings tile
          cp android-widget/res/drawable/ic_ai_tile.xml android/app/src/main/res/drawable/
          cp android-widget/java/AiChatTileService.java android/app/src/main/java/com/thanh/quanlytien/

          # APK Installer plugin (in-app update)
          cp android-update/res/xml/file_paths.xml android/app/src/main/res/xml/
          cp android-update/java/ApkInstallerPlugin.java android/app/src/main/java/com/thanh/quanlytien/

          # SMS Reader plugin (parse tin nhắn ngân hàng)
          cp android-sms/java/SmsReaderPlugin.java android/app/src/main/java/com/thanh/quanlytien/

          # Notification Reader plugin (đọc push notif từ app NH)
          cp android-notif/java/NotificationReaderService.java android/app/src/main/java/com/thanh/quanlytien/
          cp android-notif/java/NotificationReaderPlugin.java android/app/src/main/java/com/thanh/quanlytien/

          # ===== Patch MainActivity.java để register custom plugins =====
          # Capacitor 6 auto-discovery CHỈ work với plugin từ npm package + cordova-plugin.
          # Custom plugin trong project (ApkInstaller, SmsReader, NotificationReader) phải
          # register thủ công qua registerPlugin(class) trong MainActivity.onCreate().
          # Không register → window.Capacitor.Plugins.X = undefined trong JS.
          MAIN_ACTIVITY=android/app/src/main/java/com/thanh/quanlytien/MainActivity.java
          if [ -f "$MAIN_ACTIVITY" ]; then
            python3 - <<'PYMA'
          import re, sys
          path = 'android/app/src/main/java/com/thanh/quanlytien/MainActivity.java'
          with open(path, 'r', encoding='utf-8') as f:
              s = f.read()
          original = s

          # Skip nếu đã register rồi
          if 'registerPlugin(ApkInstallerPlugin.class)' in s:
              print('OK: MainActivity đã register plugins (skip)')
              sys.exit(0)

          # Capacitor mặc định:
          # public class MainActivity extends BridgeActivity {
          # }
          # → cần thêm onCreate + register 3 plugins.
          new_class = '''public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  // Register custom Capacitor plugins (auto-discovery KHÔNG work với
                  // plugin trong project, phải register thủ công).
                  registerPlugin(ApkInstallerPlugin.class);
                  registerPlugin(SmsReaderPlugin.class);
                  registerPlugin(NotificationReaderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }'''

          # Match class body (đa số case Capacitor sinh empty body)
          new_s, n = re.subn(
              r'public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{\s*\}',
              new_class,
              s,
              count=1
          )
          if n > 0:
              s = new_s
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(s)
              print('OK: MainActivity patched với registerPlugin (3 custom plugins)')
              print('--- MainActivity.java mới:')
              print(s)
          else:
              print('::error::Không match được class body MainActivity — file có thể đã có content khác')
              print('--- Current content:')
              print(s)
              sys.exit(1)
          PYMA
          else
            echo "::warning::MainActivity.java không tồn tại — skip patch"
          fi

          echo "--- Widget + Tile + Installer + SmsReader + NotifReader files đã được copy:"
          ls -la android/app/src/main/res/xml/ai_chat_widget_info.xml
          ls -la android/app/src/main/res/layout/ai_chat_widget.xml
          ls -la android/app/src/main/res/drawable/ai_widget_bg.xml
          ls -la android/app/src/main/res/drawable/ic_ai_tile.xml
          ls -la android/app/src/main/res/values/strings_widget.xml
          ls -la android/app/src/main/java/com/thanh/quanlytien/AiChatWidgetProvider.java
          ls -la android/app/src/main/java/com/thanh/quanlytien/AiChatTileService.java

      - name: Inject deeplink intent-filter qltien:// + Location permissions + Widget receiver
        run: |
          python3 - <<'PY'
          import re, sys
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              m = f.read()
          original = m

          # 1) Deeplink intent-filter qltien://
          if 'android:scheme="qltien"' not in m:
              filter_tag = ('            <intent-filter>\n'
                            '                <action android:name="android.intent.action.VIEW" />\n'
                            '                <category android:name="android.intent.category.DEFAULT" />\n'
                            '                <category android:name="android.intent.category.BROWSABLE" />\n'
                            '                <data android:scheme="qltien" />\n'
                            '            </intent-filter>')
              new_m, n = re.subn(r'(</intent-filter>)', r'\1\n' + filter_tag, m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: intent-filter qltien://')
              else:
                  print('::warning::missed qltien intent-filter')

          # 1b) AppWidget <receiver> cho AI Chat home screen widget
          if 'AiChatWidgetProvider' not in m:
              receiver_tag = (
                  '        <receiver android:name=".AiChatWidgetProvider"\n'
                  '            android:exported="true"\n'
                  '            android:label="@string/ai_widget_label">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            </intent-filter>\n'
                  '            <meta-data\n'
                  '                android:name="android.appwidget.provider"\n'
                  '                android:resource="@xml/ai_chat_widget_info" />\n'
                  '        </receiver>\n'
              )
              new_m, n = re.subn(r'(\s*</application>)', '\n' + receiver_tag + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: AiChatWidgetProvider receiver registered')
              else:
                  print('::error::FAILED to register AiChatWidgetProvider receiver — không tìm thấy </application>')
                  sys.exit(1)

          # 1c) Quick Settings TileService — vuốt status bar xuống, tap tile mở chat
          if 'AiChatTileService' not in m:
              tile_service_tag = (
                  '        <service android:name=".AiChatTileService"\n'
                  '            android:exported="true"\n'
                  '            android:icon="@drawable/ic_ai_tile"\n'
                  '            android:label="@string/ai_tile_label"\n'
                  '            android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.service.quicksettings.action.QS_TILE" />\n'
                  '            </intent-filter>\n'
                  '            <meta-data\n'
                  '                android:name="android.service.quicksettings.ACTIVE_TILE"\n'
                  '                android:value="false" />\n'
                  '            <meta-data\n'
                  '                android:name="android.service.quicksettings.TOGGLEABLE_TILE"\n'
                  '                android:value="false" />\n'
                  '        </service>\n'
              )
              new_m, n = re.subn(r'(\s*</application>)', '\n' + tile_service_tag + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: AiChatTileService registered')
              else:
                  print('::error::FAILED to register AiChatTileService — không tìm thấy </application>')
                  sys.exit(1)

          # 1d) FileProvider cho APK installer (in-app update flow)
          # Cho phép share file APK qua content:// URI tới system installer.
          # Authority: ${applicationId}.fileprovider — phải khớp với code Java.
          if 'androidx.core.content.FileProvider' not in m:
              fp_tag = (
                  '        <provider\n'
                  '            android:name="androidx.core.content.FileProvider"\n'
                  '            android:authorities="${applicationId}.fileprovider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true">\n'
                  '            <meta-data\n'
                  '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '                android:resource="@xml/file_paths" />\n'
                  '        </provider>\n'
              )
              new_m, n = re.subn(r'(\s*</application>)', '\n' + fp_tag + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: FileProvider registered (cho in-app APK installer)')
              else:
                  print('::error::FAILED to register FileProvider')
                  sys.exit(1)

          # 1e) REQUEST_INSTALL_PACKAGES permission — Android 8+ yêu cầu để
          # launch APK installer programmatically.
          if 'REQUEST_INSTALL_PACKAGES' not in m:
              perm = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perm + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: REQUEST_INSTALL_PACKAGES permission added')
              else:
                  print('::error::FAILED to add REQUEST_INSTALL_PACKAGES')
                  sys.exit(1)

          # 1ff) POST_NOTIFICATIONS — Android 13+ yêu cầu để app post notif
          # (Cần cho summary notification của bank notif → badge count icon)
          if 'POST_NOTIFICATIONS' not in m:
              perm = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perm + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: POST_NOTIFICATIONS permission added')
              else:
                  print('::error::FAILED to add POST_NOTIFICATIONS')
                  sys.exit(1)

          # 1f) READ_SMS permission — đọc tin nhắn ngân hàng (SMS Banking Parser)
          # User phải explicit grant runtime — Android bảo vệ chặt SMS permission.
          # App chỉ đọc local, không gửi SMS đi đâu.
          if 'READ_SMS' not in m:
              perm = '    <uses-permission android:name="android.permission.READ_SMS" />\n'
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perm + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: READ_SMS permission added (SMS Banking Parser)')
              else:
                  print('::error::FAILED to add READ_SMS')
                  sys.exit(1)

          # 1g) NotificationListenerService — đọc push notif từ app NH
          # User phải vào Settings → Notification access → bật cho app này.
          # Service tự khởi động khi user grant, capture notif từ bank apps.
          # exported="true" REQUIRED — Android system process bind từ ngoài app
          # qua Intent. exported=false sẽ làm service không hoạt động.
          if 'NotificationReaderService' not in m:
              service_tag = (
                  '        <service android:name=".NotificationReaderService"\n'
                  '            android:label="QLT Notif Reader"\n'
                  '            android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"\n'
                  '            android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.service.notification.NotificationListenerService" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n'
              )
              new_m, n = re.subn(r'(\s*</application>)', '\n' + service_tag + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: NotificationReaderService registered')
              else:
                  print('::error::FAILED to register NotificationReaderService')
                  sys.exit(1)

          # FIX QUAN TRỌNG: regex dùng \b (word boundary) chứ KHÔNG phải literal space
          # Capacitor sinh manifest <application\n    android:...> — sau <application là \n
          # Regex '(\s*<application )' với space cứng sẽ KHÔNG match → permissions miss

          # 2) Location permissions
          if 'ACCESS_FINE_LOCATION' not in m:
              perms = ('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                       '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n')
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perms + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: Location permissions added')
              else:
                  print('::error::FAILED to add Location permissions — regex không match <application')
                  sys.exit(1)

          # 3) Microphone (Speech Recognition)
          if 'RECORD_AUDIO' not in m:
              perm = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perm + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: RECORD_AUDIO permission added')
              else:
                  print('::error::FAILED to add RECORD_AUDIO')
                  sys.exit(1)

          # 4) Biometric (vân tay / Face ID)
          if 'USE_BIOMETRIC' not in m:
              perms = ('    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n'
                       '    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n')
              new_m, n = re.subn(r'(\s*<application\b)', '\n' + perms + r'\1', m, count=1)
              if n > 0:
                  m = new_m
                  print('OK: Biometric permissions added')
              else:
                  print('::error::FAILED to add Biometric permissions')
                  sys.exit(1)

          if m != original:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(m)

          # Verify cuối: nếu thiếu permission nào → fail build ngay
          required = ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'RECORD_AUDIO',
                      'USE_BIOMETRIC', 'REQUEST_INSTALL_PACKAGES', 'READ_SMS']
          missing = [p for p in required if p not in m]
          print('--- Permissions trong AndroidManifest:')
          for line in m.split('\n'):
              if 'uses-permission' in line:
                  print(line.strip())
          if missing:
              print('::error::Manifest thiếu permissions: ' + ', '.join(missing))
              sys.exit(1)
          # Verify FileProvider
          if 'androidx.core.content.FileProvider' not in m:
              print('::error::Manifest thiếu FileProvider — APK installer sẽ fail')
              sys.exit(1)
          print('✓ Tất cả permissions + FileProvider đã có trong AndroidManifest')
          PY

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64. Xem HUONG_DAN_BUILD_APK.md để upload keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Keystore decoded: $(stat -c%s android/app/release.keystore) bytes"

      - name: Inject signing config into build.gradle
        run: |
          python3 - <<'PY'
          import re, sys
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              g = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if 'signingConfigs' not in g:
              # Chèn signingConfigs ngay trước buildTypes
              g_new, n = re.subn(r'(\n\s*buildTypes\s*\{)', signing_block + r'\1', g, count=1)
              if n == 0:
                  print('::error::Không tìm thấy buildTypes trong build.gradle', file=sys.stderr)
                  sys.exit(1)
              g = g_new

          # Gắn signingConfig vào release block (chỉ thêm 1 lần)
          if 'signingConfig signingConfigs.release' not in g:
              g_new, n = re.subn(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  g, count=1
              )
              if n == 0:
                  print('::error::Không tìm thấy buildTypes.release trong build.gradle', file=sys.stderr)
                  sys.exit(1)
              g = g_new

          with open(path, 'w') as f:
              f.write(g)
          print('Đã inject signing config:')
          print(g)
          PY

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "QuanLyTien-${{ steps.ver.outputs.tag }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyTien-release-apk
          path: QuanLyTien-${{ steps.ver.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## 📥 TẢI FILE NÀY ĐỂ CÀI ĐẶT

            **➡️ `QuanLyTien-${{ steps.ver.outputs.tag }}.apk`**

            (KHÔNG tải "Source code (zip)" hoặc "Source code (tar.gz)" — đó là code nguồn, KHÔNG phải app cài được)

            ---

            **Phiên bản:** `${{ steps.ver.outputs.version }}`
            **Commit:** ${{ steps.ver.outputs.msg }}
            **Build time:** ${{ steps.ver.outputs.date }}

            ### Cài đặt thủ công
            1. Tải file `.apk` ở trên (file đầu tiên trong danh sách Assets)
            2. Mở file → Android hỏi "Install" → bấm Install
            3. App tự cài đè lên bản cũ — **dữ liệu giữ nguyên 100%**

            ### Cập nhật từ app (khuyên)
            App đã cài sẽ tự động fetch GitHub Releases mỗi 6h:
            - Trang chủ hiện banner **"🆕 Có phiên bản mới"**
            - Tap nút **"📥 Tải về & cài đặt"** → tự download APK + prompt cài
            - **Không cần vào trang này** lần sau

            ### Build từ source (cho developer)
            - Source code: 2 file `.zip` + `.tar.gz` bên dưới (do GitHub auto-attach)
            - Build hướng dẫn: xem `HUONG_DAN_BUILD_APK.md` trong repo
          files: QuanLyTien-${{ steps.ver.outputs.tag }}.apk
          draft: false
          prerelease: false
