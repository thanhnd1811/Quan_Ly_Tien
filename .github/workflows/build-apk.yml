name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Override launcher icons (cọc tiền xanh thay vì icon mặc định Capacitor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          SRC=www/icons/icon-512.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${entry%%:*}
            size=${entry##*:}
            DIR=android/app/src/main/res/mipmap-$density
            mkdir -p "$DIR"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_round.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_foreground.png"
          done

      - name: Inject deeplink intent-filter qltien://
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              m = f.read()
          if 'android:scheme="qltien"' not in m:
              filter_tag = ('            <intent-filter>\n'
                            '                <action android:name="android.intent.action.VIEW" />\n'
                            '                <category android:name="android.intent.category.DEFAULT" />\n'
                            '                <category android:name="android.intent.category.BROWSABLE" />\n'
                            '                <data android:scheme="qltien" />\n'
                            '            </intent-filter>')
              new_m, n = re.subn(r'(</intent-filter>)', r'\1\n' + filter_tag, m, count=1)
              if n > 0:
                  m = new_m
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(m)
                  print('OK: intent-filter qltien:// added')
              else:
                  print('::warning::missed intent-filter')
          PY

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64. Xem HUONG_DAN_BUILD_APK.md để upload keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Keystore decoded: $(stat -c%s android/app/release.keystore) bytes"

      - name: Inject signing config into build.gradle
        run: |
          python3 - <<'PY'
          import re, sys
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              g = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if 'signingConfigs' not in g:
              # Chèn signingConfigs ngay trước buildTypes
              g_new, n = re.subn(r'(\n\s*buildTypes\s*\{)', signing_block + r'\1', g, count=1)
              if n == 0:
                  print('::error::Không tìm thấy buildTypes trong build.gradle', file=sys.stderr)
                  sys.exit(1)
              g = g_new

          # Gắn signingConfig vào release block (chỉ thêm 1 lần)
          if 'signingConfig signingConfigs.release' not in g:
              g_new, n = re.subn(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  g, count=1
              )
              if n == 0:
                  print('::error::Không tìm thấy buildTypes.release trong build.gradle', file=sys.stderr)
                  sys.exit(1)
              g = g_new

          with open(path, 'w') as f:
              f.write(g)
          print('Đã inject signing config:')
          print(g)
          PY

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyTien-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
