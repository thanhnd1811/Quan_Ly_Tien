name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Override launcher icons (cọc tiền xanh thay vì icon mặc định Capacitor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          SRC=www/icons/icon-512.png
          # Xoá adaptive icon XML để Android dùng PNG mới (tránh icon X xanh dương mặc định)
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          # Resize icon vào tất cả density
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${entry%%:*}
            size=${entry##*:}
            DIR=android/app/src/main/res/mipmap-$density
            mkdir -p "$DIR"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_round.png"
            convert "$SRC" -resize ${size}x${size} "$DIR/ic_launcher_foreground.png"
          done
          echo "Done — listing icon files:"
          find android/app/src/main/res -name "ic_launcher*" | head -20

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyTien-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
